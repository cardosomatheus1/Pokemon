# A SUÍTE A CADA PUSH (ST-0.6, DEC-13).
#
# `npm test` inteiro, com navegador — nunca um recorte (`test/ci.mjs` trava
# isso). O Q2 NÃO roda aqui: a DEC-13 decidiu que horas de Actions num
# repositório privado não compram o que o `npm run sabotagem` local já compra.
#
# ZERO DEPENDÊNCIAS NO REPOSITÓRIO: o `playwright-core` é instalado FORA do
# projeto, como o `tools/README.md` manda, na versão cujo Chromium é o mesmo
# da máquina de desenvolvimento (1.56.1 → chromium 1194, 141.0.7390.37). Outro
# Chromium desenharia outros pixels, e a linha de base visual julgaria isso.
name: testes

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: playwright-core fora do projeto
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null
          npm i playwright-core@1.56.1
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: apontar o Chromium
        run: |
          CHROME="$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -1)"
          test -x "$CHROME" || { echo "Chromium não encontrado"; exit 1; }
          echo "PW_CHROME=$CHROME" >> "$GITHUB_ENV"

      # A LINHA DE BASE VISUAL LOCAL PASSA DE UMA EXECUÇÃO PARA A OUTRA.
      # Sem isto, todo runner novo a CRIA e não compara com nada: a suíte
      # termina "VERDE COM LACUNA" para sempre (é o D-093 na CI). A chave muda
      # quando a base versionada muda — tela alterada de propósito — ou quando
      # o Chromium muda, e aí a primeira execução recria e as seguintes comparam.
      - name: linha de base visual da CI
        uses: actions/cache@v4
        with:
          path: |
            test/fixtures/visual-base-local.json
            test/fixtures/visual-base-local.meta.json
          key: visual-base-chromium1194-${{ hashFiles('test/fixtures/visual-base.json') }}

      - name: a suíte
        run: npm test

  # O ENSAIO DO PILOTO A CADA PUSH (ST-0.9).
  #
  # A suíte inteira estava verde e nenhuma aposta do servidor era paga (D-112):
  # cada peça testada, o encaixe não. Quem achou foi o ensaio — cria conta,
  # aposta, espera a rodada ser LIQUIDADA (o XP sobe), sai e entra de novo, num
  # navegador de verdade contra o servidor inteiro. Aqui ele reprova a CI.
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: playwright-core fora do projeto
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null
          npm i playwright-core@1.56.1
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: apontar o Chromium
        run: |
          CHROME="$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -1)"
          test -x "$CHROME" || { echo "Chromium não encontrado"; exit 1; }
          echo "PW_CHROME=$CHROME" >> "$GITHUB_ENV"

      # UM PASSO SÓ: processo em segundo plano pode não sobreviver ao fim do
      # passo que o criou, e o ensaio precisa do servidor vivo até o fim.
      - name: o servidor, com banco próprio, e o ensaio contra ele
        run: |
          PORTA=8080 BANCO=/tmp/ensaio.db npm run servidor &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/saude && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/saude
          node tools/ensaio-piloto.mjs http://127.0.0.1:8080
